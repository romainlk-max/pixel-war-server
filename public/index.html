<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f6; --surface:#ffffff; --ink:#1c1b1f; --ink-soft:#6b6a67;
    --line:#e6e3db; --line-strong:rgba(28,27,31,0.16);
    --accent:#ff4d3d; --accent-ink:#7a1f14; --indigo:#1b3a78; --success:#1f9d67;
    --shadow-sm: 0 2px 8px rgba(28,27,31,0.08);
    --shadow-md: 0 10px 30px rgba(28,27,31,0.14);
    --display: 'Space Grotesk', 'Inter', sans-serif;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); overflow:hidden; }
  #app{ position:relative; width:100vw; height:100vh; }

  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:18px 22px; pointer-events:none;
  }
  #topbar > *{ pointer-events:auto; }
  .brand{
    display:flex; align-items:center; gap:9px;
    background:rgba(255,255,255,0.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:11px; padding:9px 14px 9px 11px; box-shadow:var(--shadow-sm);
    cursor:pointer; user-select:none;
  }
  .brand .dot{ width:11px; height:11px; border-radius:3px; background:var(--accent); flex:none; transition:background 0.2s; }
  .brand .dot.offline{ background:#b8b5ac; }
  .brand .dot.admin{ background:var(--indigo); }
  .brand b{ font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:-0.01em; text-transform:uppercase; color:var(--ink); }
  .brand .admin-tag{ font-family:var(--mono); font-size:10px; color:var(--indigo); border:1px solid var(--indigo); border-radius:6px; padding:2px 6px; margin-left:2px; }

  .stats{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:60vw; }
  .stat-pill{
    background:rgba(255,255,255,0.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:20px; padding:8px 14px; box-shadow:var(--shadow-sm);
    font-family:var(--mono); font-size:11px; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .stat-pill b{ color:var(--ink); font-weight:600; font-size:12px; }
  .stat-pill.spent b{ color:var(--accent); }
  .stat-pill.revenue b{ color:var(--indigo); }

  canvas{ display:block; cursor:grab; background:var(--bg); touch-action:none; }

  #zoomctl{
    position:absolute; bottom:88px; right:22px; z-index:10;
    display:flex; flex-direction:column; gap:1px;
    background:rgba(255,255,255,0.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow-sm);
  }
  #zoomctl button{
    width:38px; height:38px; background:transparent; color:var(--ink); border:none;
    border-bottom:1px solid var(--line); font-family:var(--display); font-size:16px; font-weight:700; cursor:pointer;
  }
  #zoomctl button:last-child{ border-bottom:none; }
  #zoomctl button:hover{ background:var(--bg); color:var(--accent); }
  #zoomctl button:active{ transform:scale(0.94); }

  #hint{
    position:absolute; bottom:160px; left:22px; z-index:10;
    font-family:var(--mono); font-size:11px; color:var(--ink-soft); max-width:280px; line-height:1.6;
    background:rgba(255,255,255,0.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:10px; padding:10px 13px; box-shadow:var(--shadow-sm);
  }
  #hint b{ color:var(--accent-ink); }

  @media (max-width: 640px){
    #hint{ display:none; }
    #zoomctl{ bottom:180px; right:14px; }
    #topbar{ padding:12px 14px; }
    .stats{ max-width:56vw; }
  }

  #palette-toggle{
    position:absolute; bottom:18px; left:22px; z-index:16;
    width:52px; height:52px; border-radius:14px; cursor:pointer;
    border:3px solid var(--surface); box-shadow:var(--shadow-md);
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.15s cubic-bezier(.34,1.56,.64,1);
  }
  #palette-toggle:hover{ transform:scale(1.06); }
  #palette-toggle:active{ transform:scale(0.95); }
  #palette-toggle svg{ width:20px; height:20px; opacity:0.85; }

  #palette-panel{
    position:absolute; bottom:82px; left:22px; z-index:15;
    background:rgba(255,255,255,0.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line); border-radius:16px; padding:12px 14px; box-shadow:var(--shadow-md);
    display:flex; align-items:center; gap:12px; max-width:min(480px, 88vw);
    opacity:0; pointer-events:none; transform-origin:bottom left; transform:translateY(10px) scale(0.94);
    transition:opacity 0.18s ease, transform 0.18s cubic-bezier(.34,1.56,.64,1);
  }
  #palette-panel.open{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }
  #swatches{ display:flex; gap:6px; flex-wrap:wrap; max-width:480px; }
  .swatch{
    width:26px; height:26px; border-radius:7px; cursor:pointer;
    border:2px solid rgba(0,0,0,0.06); transition:transform 0.12s cubic-bezier(.34,1.56,.64,1), box-shadow 0.12s ease;
    position:relative; flex:none;
  }
  .swatch:hover{ transform:translateY(-3px) scale(1.06); }
  .swatch:active{ transform:translateY(-1px) scale(0.96); }
  .swatch.selected{
    border-color:var(--ink);
    box-shadow:0 0 0 3px var(--surface), 0 0 0 5px var(--ink), 0 6px 10px rgba(0,0,0,0.18);
    transform:translateY(-3px);
  }
  #dock-divider{ width:1px; align-self:stretch; background:var(--line); flex:none; }
  #dock-price{
    font-family:var(--mono); font-size:11px; color:var(--ink-soft); text-align:center; flex:none;
    display:flex; flex-direction:column; gap:2px; line-height:1.3;
  }
  #dock-price b{ font-family:var(--display); font-size:16px; color:var(--ink); font-weight:700; }

  @media (max-width: 640px){
    #palette-panel{ flex-wrap:wrap; justify-content:center; padding:10px 14px; gap:10px; }
    .swatch{ width:30px; height:30px; }
    #dock-divider{ display:none; }
  }

  #toast{
    position:absolute; z-index:30; top:78px; left:50%; transform:translateX(-50%) translateY(-6px) scale(0.97);
    background:var(--ink); color:#fff; font-family:var(--mono); font-size:12px; font-weight:500;
    padding:9px 18px; border-radius:24px; opacity:0; pointer-events:none;
    transition:opacity 0.22s ease, transform 0.22s cubic-bezier(.34,1.56,.64,1); box-shadow:var(--shadow-md);
    max-width:80vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  #toast .swatch-dot{ display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:7px; vertical-align:middle; }

  #pay-popup{
    position:absolute; z-index:40; display:none;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    color:var(--ink); border-radius:12px; padding:16px 18px; font-family:var(--sans); font-size:13px;
    box-shadow:var(--shadow-md); width:240px; border:1px solid var(--line);
  }
  #pay-popup .eyebrow{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); }
  #pay-popup .amount{ font-family:var(--display); font-weight:700; font-size:28px; color:var(--ink); margin:2px 0 4px; }
  #pay-popup .coords{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-bottom:12px; }
  #pay-popup .divider{ border-top:1px dashed var(--line-strong); margin:0 0 12px; }
  #pay-popup .row{ display:flex; gap:8px; }
  #pay-popup button{
    flex:1; padding:10px; border-radius:8px; border:none; cursor:pointer;
    font-family:var(--sans); font-size:12px; font-weight:600; transition:transform 0.1s ease, background 0.15s ease;
  }
  #pay-popup button:active{ transform:scale(0.96); }
  #pay-cancel{ background:var(--bg); color:var(--ink-soft); border:1px solid var(--line) !important; width:100%; margin-top:8px; }
  #pay-cancel:hover{ background:var(--line); }
  #admin-place-btn{ background:var(--indigo); color:#fff; width:100%; }
  #admin-place-btn:hover{ background:#122a5c; }
  #paypal-button-container{ min-height:44px; }
  #paypal-loading{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); text-align:center; padding:10px 0; }

  #loading{
    position:absolute; inset:0; z-index:100; background:var(--bg);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    font-family:var(--mono); font-size:13px; color:var(--ink-soft);
  }
  #loading.hidden{ display:none; }
</style>
</head>
<body>

<div id="app">
  <div id="loading">Connexion au serveur…</div>
  <canvas id="grid"></canvas>

  <div id="topbar">
    <div class="brand" id="admin-toggle" title="Cliquer pour se connecter en admin">
      <span class="dot" id="conn-dot"></span><b>Pixel War</b>
      <span class="admin-tag" id="admin-tag" style="display:none;">ADMIN</span>
    </div>
    <div class="stats">
      <div class="stat-pill">Grille <b id="stat-dims">—</b></div>
      <div class="stat-pill">Posés <b id="stat-placed">0</b></div>
      <div class="stat-pill spent" id="spent-pill">Dépensé <b id="stat-spent">0</b> €</div>
      <div class="stat-pill revenue" id="revenue-pill" style="display:none;">Revenu total <b id="stat-revenue">0</b> €</div>
    </div>
  </div>

  <div id="zoomctl">
    <button id="zoom-in" aria-label="Zoomer">+</button>
    <button id="zoom-out" aria-label="Dézoomer">−</button>
    <button id="zoom-reset" aria-label="Réinitialiser la vue">⤾</button>
  </div>

  <div id="hint"></div>
  <div id="toast"></div>

  <div id="pay-popup">
    <div class="eyebrow" id="pay-eyebrow">Réclamer ce pixel</div>
    <div class="amount" id="pay-amount">1,00 €</div>
    <div class="coords" id="pay-coords">(0, 0)</div>
    <div class="divider"></div>
    <div id="pay-paypal-zone">
      <div id="paypal-button-container"></div>
    </div>
    <button id="admin-place-btn" style="display:none;">Poser (admin, gratuit)</button>
    <button id="pay-cancel">Annuler</button>
  </div>

  <div id="palette-panel">
    <div id="swatches"></div>
    <div id="dock-divider"></div>
    <div id="dock-price">1 pixel<b id="price-label">= 1 €</b></div>
  </div>

  <div id="palette-toggle" aria-label="Choisir une couleur">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22c5.5 0 10-4 10-9a8 8 0 0 0-8-8c-5 0-9 3.5-9 8.5A5.5 5.5 0 0 0 6 19h1a2 2 0 0 1 2 2 2 2 0 0 0 2 2z"></path>
      <circle cx="7.5" cy="10.5" r="1.2" fill="white" stroke="none"></circle>
      <circle cx="12" cy="7.5" r="1.2" fill="white" stroke="none"></circle>
      <circle cx="16.5" cy="10.5" r="1.2" fill="white" stroke="none"></circle>
    </svg>
  </div>
</div>

<script>
(function(){
  "use strict";

  const PALETTE = [
    '#ffffff','#d4d7d9','#898d90','#1c1b1f',
    '#ff4d3d','#ff8a5c','#ffb02e','#ffd23f','#e8d63c','#c8dc3f',
    '#8fd13f','#2fb37f','#1f9d8e','#3fa9c9','#1b3a78','#5c6fd1',
    '#7d5cd1','#a15cd1','#d15ca1','#d15c7a',
    '#a13f3f','#7a5c4a','#9c7a5c','#6b6a67'
  ];

  const canvas = document.getElementById('grid');
  const ctx = canvas.getContext('2d');
  let dpr = window.devicePixelRatio || 1;
  let viewW, viewH;

  let GRID_W = 1, GRID_H = 1, PRICE_PER_PIXEL = 1;
  let ready = false;

  let camX = 0, camY = 0;
  let scale = 1;
  let minScale = 1;

  function computeMinScale(){ return Math.max(viewW/GRID_W, viewH/GRID_H); }
  function fitGridToScreen(){
    minScale = computeMinScale();
    scale = minScale;
    camX = GRID_W/2; camY = GRID_H/2;
  }
  function clampCamera(){
    const halfW = (viewW/2)/scale, halfH = (viewH/2)/scale;
    if(halfW*2 >= GRID_W){ camX = GRID_W/2; } else { camX = Math.max(halfW, Math.min(GRID_W-halfW, camX)); }
    if(halfH*2 >= GRID_H){ camY = GRID_H/2; } else { camY = Math.max(halfH, Math.min(GRID_H-halfH, camY)); }
  }
  function gridToScreen(gx,gy){ return { x: viewW/2 + (gx-camX)*scale, y: viewH/2 + (gy-camY)*scale }; }
  function screenToGrid(sx,sy){ return { x: camX + (sx-viewW/2)/scale, y: camY + (sy-viewH/2)/scale }; }

  const pixels = new Map();
  function setPixelLocal(x,y,color){ pixels.set(x+','+y, color); }

  let firstResize = true;
  function resize(){
    viewW = window.innerWidth; viewH = window.innerHeight;
    dpr = window.devicePixelRatio || 1;
    canvas.width = viewW*dpr; canvas.height = viewH*dpr;
    canvas.style.width = viewW+"px"; canvas.style.height = viewH+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!ready) return;
    if(firstResize){ fitGridToScreen(); firstResize=false; }
    else { minScale = computeMinScale(); if(scale < minScale) scale = minScale; clampCamera(); }
    draw();
  }
  window.addEventListener('resize', resize);

  let hoverCell = null;

  function draw(){
    if(!ready) return;
    ctx.clearRect(0,0,viewW,viewH);
    ctx.fillStyle = '#faf9f6';
    ctx.fillRect(0,0,viewW,viewH);

    const topLeft = screenToGrid(0,0);
    const botRight = screenToGrid(viewW,viewH);
    const cell = scale;

    pixels.forEach((color, k)=>{
      const [gx,gy] = k.split(',').map(Number);
      const p = gridToScreen(gx,gy);
      if(p.x+cell < 0 || p.y+cell < 0 || p.x > viewW || p.y > viewH) return;
      ctx.fillStyle = color;
      ctx.fillRect(p.x, p.y, cell+0.5, cell+0.5);
    });

    ctx.strokeStyle = 'rgba(28,27,31,0.16)';
    ctx.lineWidth = 1;
    const startX = Math.max(0, Math.floor(topLeft.x));
    const endX = Math.min(GRID_W, Math.ceil(botRight.x));
    for(let gx=startX; gx<=endX; gx++){
      const p = gridToScreen(gx,0);
      ctx.beginPath(); ctx.moveTo(p.x,0); ctx.lineTo(p.x,viewH); ctx.stroke();
    }
    const startY = Math.max(0, Math.floor(topLeft.y));
    const endY = Math.min(GRID_H, Math.ceil(botRight.y));
    for(let gy=startY; gy<=endY; gy++){
      const p = gridToScreen(0,gy);
      ctx.beginPath(); ctx.moveTo(0,p.y); ctx.lineTo(viewW,p.y); ctx.stroke();
    }

    const gTL = gridToScreen(0,0), gBR = gridToScreen(GRID_W,GRID_H);
    ctx.strokeStyle = '#1c1b1f';
    ctx.lineWidth = 2;
    ctx.strokeRect(gTL.x, gTL.y, gBR.x-gTL.x, gBR.y-gTL.y);

    if(hoverCell){
      const p = gridToScreen(hoverCell.x, hoverCell.y);
      ctx.fillStyle = selectedColor + 'b3';
      ctx.fillRect(p.x,p.y,scale,scale);
      ctx.strokeStyle = payPending ? '#ff4d3d' : '#1c1b1f';
      ctx.lineWidth = 2; ctx.setLineDash([3,3]);
      ctx.strokeRect(p.x,p.y,scale,scale);
      ctx.setLineDash([]);
    }
  }

  // ---------- Zoom ----------
  canvas.addEventListener('wheel', e=>{
    if(!ready) return;
    e.preventDefault();
    const before = screenToGrid(e.offsetX, e.offsetY);
    scale = Math.min(30, Math.max(minScale, scale*(e.deltaY<0?1.1:0.9)));
    const after = screenToGrid(e.offsetX, e.offsetY);
    camX += before.x - after.x; camY += before.y - after.y;
    clampCamera(); draw();
  }, {passive:false});
  document.getElementById('zoom-in').onclick = ()=>{ if(!ready)return; scale=Math.min(30,scale*1.3); clampCamera(); draw(); };
  document.getElementById('zoom-out').onclick = ()=>{ if(!ready)return; scale=Math.max(minScale,scale*0.7); clampCamera(); draw(); };
  document.getElementById('zoom-reset').onclick = ()=>{ if(!ready)return; fitGridToScreen(); draw(); };

  // ---------- Pan (clic gauche) + selection (clic droit) ----------
  let isPanning=false, panStart=null, camStart=null, spaceHeld=false;
  window.addEventListener('keydown', e=>{ if(e.code==='Space') spaceHeld=true; });
  window.addEventListener('keyup', e=>{ if(e.code==='Space') spaceHeld=false; });
  canvas.addEventListener('contextmenu', e=> e.preventDefault());

  canvas.addEventListener('mousedown', e=>{
    if(!ready) return;
    if(e.button===0 || spaceHeld){
      isPanning=true; panStart={x:e.clientX,y:e.clientY}; camStart={x:camX,y:camY};
      canvas.style.cursor='grabbing'; return;
    }
    if(e.button===2 && !payPending){
      const g = screenToGrid(e.offsetX, e.offsetY);
      const gx = Math.max(0, Math.min(GRID_W-1, Math.floor(g.x)));
      const gy = Math.max(0, Math.min(GRID_H-1, Math.floor(g.y)));
      askPayment(gx, gy, e.clientX, e.clientY);
    }
  });
  canvas.addEventListener('mousemove', e=>{
    if(!ready) return;
    if(isPanning){
      camX = camStart.x - (e.clientX-panStart.x)/scale;
      camY = camStart.y - (e.clientY-panStart.y)/scale;
      clampCamera(); draw(); return;
    }
    const g = screenToGrid(e.offsetX, e.offsetY);
    const gx = Math.max(0, Math.min(GRID_W-1, Math.floor(g.x)));
    const gy = Math.max(0, Math.min(GRID_H-1, Math.floor(g.y)));
    hoverCell = {x:gx,y:gy};
    canvas.style.cursor = 'grab';
    draw();
  });
  window.addEventListener('mouseup', ()=>{ if(isPanning){isPanning=false; canvas.style.cursor='grab';} });

  // ---------- Tactile ----------
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  function setHintText(){
    document.getElementById('hint').innerHTML = isTouch
      ? '<b>Glisser</b> = déplacer · <b>pincer</b> = zoom<br><b>Tapoter une case</b> = payer '+PRICE_PER_PIXEL+'€ pour la colorier'
      : '<b>Molette</b> = zoom · <b>clic gauche maintenu</b> = déplacer<br><b>Clic droit</b> = payer '+PRICE_PER_PIXEL+'€ pour poser un pixel';
    document.getElementById('hint').style.display = isTouch ? 'none' : 'block';
  }

  function touchDist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
  function touchCenter(t){ return { x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2 }; }
  let touchState = { mode:null };

  canvas.addEventListener('touchstart', e=>{
    if(!ready) return;
    e.preventDefault();
    if(e.touches.length===1){
      const t = e.touches[0];
      touchState = { mode:'pan-or-tap', startX:t.clientX, startY:t.clientY, lastX:t.clientX, lastY:t.clientY, startTime:Date.now(), moved:false, camStart:{x:camX,y:camY} };
    } else if(e.touches.length===2){
      touchState = { mode:'pinch', dist:touchDist(e.touches), center:touchCenter(e.touches), scaleStart:scale, camStart:{x:camX,y:camY} };
    }
  }, {passive:false});

  canvas.addEventListener('touchmove', e=>{
    if(!ready) return;
    e.preventDefault();
    if(e.touches.length===1 && touchState.mode==='pan-or-tap'){
      const t = e.touches[0];
      const dx = t.clientX-touchState.startX, dy = t.clientY-touchState.startY;
      if(Math.abs(dx)>8 || Math.abs(dy)>8) touchState.moved = true;
      touchState.lastX = t.clientX; touchState.lastY = t.clientY;
      camX = touchState.camStart.x - dx/scale;
      camY = touchState.camStart.y - dy/scale;
      clampCamera(); draw();
    } else if(e.touches.length===2 && touchState.mode==='pinch'){
      const newDist = touchDist(e.touches);
      const rect = canvas.getBoundingClientRect();
      const cx = touchState.center.x-rect.left, cy = touchState.center.y-rect.top;
      const before = screenToGrid(cx,cy);
      scale = Math.min(30, Math.max(minScale, touchState.scaleStart*(newDist/touchState.dist)));
      const after = screenToGrid(cx,cy);
      camX += before.x-after.x; camY += before.y-after.y;
      clampCamera(); draw();
    }
  }, {passive:false});

  canvas.addEventListener('touchend', e=>{
    if(!ready) return;
    e.preventDefault();
    if(touchState.mode==='pan-or-tap' && !touchState.moved && (Date.now()-touchState.startTime)<400 && !payPending){
      const rect = canvas.getBoundingClientRect();
      const x = touchState.lastX-rect.left, y = touchState.lastY-rect.top;
      const g = screenToGrid(x,y);
      const gx = Math.max(0, Math.min(GRID_W-1, Math.floor(g.x)));
      const gy = Math.max(0, Math.min(GRID_H-1, Math.floor(g.y)));
      askPayment(gx, gy, touchState.lastX, touchState.lastY);
    }
    touchState = { mode:null };
  }, {passive:false});

  // ---------- Palette ----------
  let selectedColor = PALETTE[4];
  const swatchesEl = document.getElementById('swatches');
  const paletteToggle = document.getElementById('palette-toggle');
  const palettePanel = document.getElementById('palette-panel');
  paletteToggle.style.background = selectedColor;

  paletteToggle.onclick = ()=>{ palettePanel.classList.toggle('open'); };
  document.addEventListener('click', e=>{
    if(palettePanel.classList.contains('open') && !palettePanel.contains(e.target) && !paletteToggle.contains(e.target)){
      palettePanel.classList.remove('open');
    }
  });
  PALETTE.forEach((hex)=>{
    const el = document.createElement('div');
    el.className = 'swatch' + (hex===selectedColor ? ' selected' : '');
    el.style.background = hex; el.title = hex; el.tabIndex = 0;
    el.onclick = (ev)=>{
      ev.stopPropagation();
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
      el.classList.add('selected');
      selectedColor = hex;
      paletteToggle.style.background = hex;
      draw();
      palettePanel.classList.remove('open');
    };
    swatchesEl.appendChild(el);
  });

  // ---------- Admin ----------
  let adminToken = localStorage.getItem('pixelWarAdminToken') || null;
  const adminToggle = document.getElementById('admin-toggle');
  const adminTag = document.getElementById('admin-tag');
  const connDot = document.getElementById('conn-dot');
  const spentPill = document.getElementById('spent-pill');
  const revenuePill = document.getElementById('revenue-pill');

  function updateAdminUI(){
    if(adminToken){
      adminTag.style.display = 'inline-block';
      connDot.classList.add('admin');
      spentPill.style.display = 'none';
      revenuePill.style.display = 'flex';
      refreshAdminStats();
    } else {
      adminTag.style.display = 'none';
      connDot.classList.remove('admin');
      spentPill.style.display = 'flex';
      revenuePill.style.display = 'none';
    }
  }

  async function refreshAdminStats(){
    if(!adminToken) return;
    try{
      const res = await fetch('/api/admin/stats', { headers: { 'x-admin-token': adminToken } });
      if(res.status === 401){ logoutAdmin(); return; }
      const data = await res.json();
      document.getElementById('stat-revenue').textContent = data.totalRevenue.toLocaleString('fr-FR');
    }catch(e){ /* silencieux */ }
  }

  async function loginAdmin(){
    const pwd = prompt('Mot de passe administrateur :');
    if(pwd === null) return;
    try{
      const res = await fetch('/api/admin/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: pwd })
      });
      if(!res.ok){ alert('Mot de passe incorrect.'); return; }
      const data = await res.json();
      adminToken = data.token;
      localStorage.setItem('pixelWarAdminToken', adminToken);
      updateAdminUI();
      showToast('Connecté en admin', '#1b3a78');
    }catch(e){ alert('Erreur de connexion au serveur.'); }
  }
  function logoutAdmin(){
    adminToken = null;
    localStorage.removeItem('pixelWarAdminToken');
    updateAdminUI();
  }
  adminToggle.onclick = ()=> adminToken ? (confirm('Se déconnecter du mode admin ?') && logoutAdmin()) : loginAdmin();

  // ---------- Paiement (PayPal) + pose admin ----------
  let payPending = false;
  let totalSpent = 0;
  const payPopup = document.getElementById('pay-popup');
  const payCancel = document.getElementById('pay-cancel');
  const paypalZone = document.getElementById('pay-paypal-zone');
  const adminPlaceBtn = document.getElementById('admin-place-btn');
  let pendingCell = null;
  let paypalReady = false;
  let paypalButtonsRendered = false;

  function askPayment(x,y,screenX,screenY){
    payPending = true;
    pendingCell = {x,y};
    document.getElementById('pay-coords').textContent = '('+x+', '+y+')';
    payPopup.style.display = 'block';

    if(adminToken){
      paypalZone.style.display = 'none';
      adminPlaceBtn.style.display = 'block';
      document.getElementById('pay-eyebrow').textContent = 'Poser ce pixel (admin)';
      document.getElementById('pay-amount').textContent = 'Gratuit';
    } else {
      adminPlaceBtn.style.display = 'none';
      paypalZone.style.display = 'block';
      document.getElementById('pay-eyebrow').textContent = 'Réclamer ce pixel';
      document.getElementById('pay-amount').textContent = PRICE_PER_PIXEL.toFixed(2).replace('.',',')+' €';
    }

    const popupW = 240;
    let left = screenX + 14, top = screenY + 14;
    if(left + popupW > window.innerWidth) left = screenX - popupW - 14;
    if(top + 220 > window.innerHeight) top = Math.max(8, window.innerHeight - 230);
    payPopup.style.left = Math.max(8,left)+'px';
    payPopup.style.top = Math.max(8,top)+'px';
    draw();
  }
  function closePayment(){
    payPending = false; pendingCell = null;
    payPopup.style.display = 'none';
    draw();
  }
  payCancel.onclick = closePayment;

  adminPlaceBtn.onclick = ()=>{
    if(!pendingCell || ws.readyState !== WebSocket.OPEN) return;
    const {x,y} = pendingCell;
    ws.send(JSON.stringify({ type:'place', x, y, color: selectedColor, adminToken }));
    showToast('Pixel posé en ('+x+', '+y+') — admin', selectedColor);
    closePayment();
  };

  const toastEl = document.getElementById('toast');
  function showToast(msg, color){
    toastEl.innerHTML = (color ? '<span class="swatch-dot" style="background:'+color+'"></span>' : '') + msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 1500);
  }

  function applyPlacement(x,y,color){
    setPixelLocal(x,y,color);
    document.getElementById('stat-placed').textContent = pixels.size.toLocaleString('fr-FR');
    draw();
  }

  // ---------- Chargement config + SDK PayPal ----------
  async function initPaypal(){
    try{
      const cfgRes = await fetch('/api/config');
      const cfg = await cfgRes.json();
      if(!cfg.paypalClientId){
        paypalZone.innerHTML = '<div id="paypal-loading">Paiement indisponible (PayPal non configuré côté serveur)</div>';
        return;
      }
      const script = document.createElement('script');
      script.src = 'https://www.paypal.com/sdk/js?client-id='+encodeURIComponent(cfg.paypalClientId)+'&currency=EUR&intent=capture';
      script.onload = ()=>{
        paypalReady = true;
        renderPaypalButtons();
      };
      script.onerror = ()=>{
        paypalZone.innerHTML = '<div id="paypal-loading">Erreur de chargement PayPal</div>';
      };
      document.head.appendChild(script);
    }catch(e){
      paypalZone.innerHTML = '<div id="paypal-loading">Erreur de configuration</div>';
    }
  }

  function renderPaypalButtons(){
    if(paypalButtonsRendered || !window.paypal) return;
    paypalButtonsRendered = true;
    window.paypal.Buttons({
      style: { layout:'vertical', color:'black', shape:'rect', label:'pay', height:40 },
      createOrder: async ()=>{
        const res = await fetch('/api/paypal/create-order', { method:'POST' });
        const data = await res.json();
        if(!data.orderID) throw new Error('Impossible de créer la commande PayPal');
        return data.orderID;
      },
      onApprove: async (data)=>{
        try{
          const res = await fetch('/api/paypal/capture-order', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ orderID: data.orderID })
          });
          const result = await res.json();
          if(!result.success){ showToast('Paiement non confirmé', '#d1453b'); return; }
          if(!pendingCell || ws.readyState !== WebSocket.OPEN){ showToast('Session expirée, réessaie', '#d1453b'); return; }
          const {x,y} = pendingCell;
          ws.send(JSON.stringify({ type:'place', x, y, color: selectedColor, orderID: data.orderID }));
          totalSpent += PRICE_PER_PIXEL;
          document.getElementById('stat-spent').textContent = totalSpent.toLocaleString('fr-FR');
          showToast('Pixel payé en ('+x+', '+y+')', selectedColor);
          closePayment();
        }catch(e){ showToast('Erreur de paiement', '#d1453b'); }
      },
      onError: ()=>{ showToast('Erreur PayPal', '#d1453b'); }
    }).render('#paypal-button-container');
  }

  // ---------- Connexion WebSocket ----------
  const wsProtocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(wsProtocol + location.host);

  ws.onopen = ()=>{ connDot.classList.remove('offline'); };
  ws.onclose = ()=>{ connDot.classList.add('offline'); showToast('Connexion perdue…', '#898d90'); };
  ws.onerror = ()=>{ connDot.classList.add('offline'); };

  ws.onmessage = (event)=>{
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }

    if(msg.type === 'init'){
      GRID_W = msg.gridW; GRID_H = msg.gridH; PRICE_PER_PIXEL = msg.pricePerPixel;
      Object.entries(msg.pixels).forEach(([k,color])=>{
        const [x,y] = k.split(',').map(Number);
        setPixelLocal(x,y,color);
      });
      document.getElementById('stat-dims').textContent = GRID_W+'×'+GRID_H;
      document.getElementById('stat-placed').textContent = pixels.size.toLocaleString('fr-FR');
      document.getElementById('price-label').textContent = '= '+PRICE_PER_PIXEL+' €';
      setHintText();
      updateAdminUI();
      ready = true;
      document.getElementById('loading').classList.add('hidden');
      resize();
    }

    if(msg.type === 'place'){
      applyPlacement(msg.x, msg.y, msg.color);
    }
  };

  initPaypal();
  resize();
})();
</script>
</body>
</html>
